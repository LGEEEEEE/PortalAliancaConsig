<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca CNPJ</title>
</head>

<body>
    <label for="cnpj">Digite aqui seu CNPJ</label> <br>
    <input type="text" id="cnpj" placeholder="00.000.000/0000-00" maxlength="18">
    <button id="btn-buscar">BUSCAR CNPJ</button>

    <div class="resultado-apibrasil" style="margin-top: 20px;"></div>

    <script>
        // O evento de clique já vai ser a função assíncrona
        document.getElementById('btn-buscar').addEventListener('click', async () => {

            // 1. Pega o valor digitado no input
            const cnpjDigitado = document.getElementById('cnpj').value;

            // 2. Limpa os caracteres que não são números
            const cnpjLimpo = cnpjDigitado.replace(/\D/g, '');

            if (cnpjLimpo.length !== 14) {
                alert("O CNPJ precisa ter 14 números!");
                return;
            }

            // Seleciona a div de resultado para usarmos depois
            const divResultado = document.querySelector('.resultado-apibrasil');
            divResultado.innerHTML = "<em>Buscando dados na Receita Federal...</em>";

            try {
                // 1. Trocamos a URL para a API da CNPJ.ws
                const resposta = await fetch(`https://brasilapi.com.br/api/cnpj/v1${cnpjLimpo}`);

                // Se o CNPJ for inválido ou não existir
                if (!resposta.ok) {
                    divResultado.innerHTML = "<p style='color:red;'>Erro ao buscar CNPJ. Verifique o número digitado.</p>";
                    return;
                }

                const data = await resposta.json();

                // 2. O array de sócios na CNPJ.ws chama 'socios' e o nome do sócio é 'nome'
                let nomeSocio = "Sócio não informado";
                if (data.socios && data.socios.length > 0) {
                    nomeSocio = data.socios[0].nome;
                }

                // 3. Injetando o HTML com o caminho correto das informações nesta API
                divResultado.innerHTML = `
        <div style="border: 1px solid #ccc; padding: 15px; border-radius: 8px; background-color: #f9f9f9;">
            <h3>${data.razao_social}</h3>
            <p><strong>Nome Fantasia:</strong> ${data.estabelecimento.nome_fantasia || 'N/A'}</p>
            <p><strong>Natureza Jurídica:</strong> ${data.natureza_juridica.descricao}</p>
            <p><strong>Estado (UF):</strong> ${data.estabelecimento.estado.sigla}</p>
            <p><strong>Sócio Principal:</strong> ${nomeSocio}</p>
        </div>
    `;

            } catch (error) {
                console.error("Erro na conexão:", error);
                divResultado.innerHTML = "<p style='color:red;'>Falha na comunicação com a API de CNPJ.</p>";
            }
        });
    </script>
</body>

</html>
