<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Imagens para PDF</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body {
            background-color: #f8f9fa;
        }
        /* Customizando apenas a área de drop que o Bootstrap não tem nativa */
        .upload-area {
            border: 2px dashed #0d6efd;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s, border-color 0.3s;
        }
        .upload-area:hover {
            background-color: #e9ecef;
            border-color: #0a58ca;
        }
    </style>
</head>
<body class="d-flex align-items-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-md-5 text-center">
                        
                        <h2 class="card-title fw-bold text-primary mb-3">
                            <i class="bi bi-file-earmark-pdf"></i> Imagem para PDF
                        </h2>
                        <p class="text-muted mb-4">Selecione suas imagens (JPG, JPEG, PNG). Cada uma será convertida em um arquivo PDF separado.</p>
                        
                        <label class="upload-area p-5 mb-4 d-block" for="imageInput">
                            <i class="bi bi-cloud-arrow-up display-4 text-primary"></i>
                            <h5 class="mt-3 mb-1" id="uploadTitle">Clique para buscar imagens</h5>
                            <p class="text-muted mb-0 small" id="uploadSubtitle">ou arraste e solte aqui</p>
                        </label>
                        <input type="file" id="imageInput" multiple accept=".jpg, .jpeg, .png" class="d-none">

                        <button class="btn btn-primary btn-lg w-100 mb-3 fw-semibold shadow-sm" id="convertBtn" disabled>
                            <span id="btnText">Converter e Baixar</span>
                            <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                        </button>
                        
                        <div id="statusAlert" class="alert d-none mb-0" role="alert"></div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const { jsPDF } = window.jspdf;

        const imageInput = document.getElementById('imageInput');
        const convertBtn = document.getElementById('convertBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const statusAlert = document.getElementById('statusAlert');
        const uploadTitle = document.getElementById('uploadTitle');
        const uploadSubtitle = document.getElementById('uploadSubtitle');

        // Gerencia a seleção de arquivos e atualiza a UI
        imageInput.addEventListener('change', () => {
            const fileCount = imageInput.files.length;
            
            if (fileCount > 0) {
                uploadTitle.innerHTML = `<i class="bi bi-check-circle-fill text-success"></i> ${fileCount} arquivo(s) selecionado(s)`;
                uploadTitle.classList.replace('text-primary', 'text-success');
                uploadSubtitle.innerText = "Pronto para conversão";
                convertBtn.disabled = false;
                
                // Reseta o alerta se houver um arquivo novo
                statusAlert.classList.add('d-none');
            } else {
                resetUploadArea();
            }
        });

        // Lógica de conversão
        convertBtn.addEventListener('click', async () => {
            const files = imageInput.files;
            if (files.length === 0) return;

            // Altera UI para estado de carregamento
            convertBtn.disabled = true;
            btnText.innerText = "Processando... ";
            btnSpinner.classList.remove('d-none');
            
            statusAlert.className = 'alert alert-info';
            statusAlert.classList.remove('d-none');

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                statusAlert.innerHTML = `<i class="bi bi-arrow-repeat"></i> Processando: <strong>${file.name}</strong> (${i + 1}/${files.length})`;
                
                try {
                    await processAndDownloadPDF(file);
                    await new Promise(r => setTimeout(r, 600)); // Delay de segurança do navegador
                } catch (error) {
                    console.error("Erro ao processar arquivo:", error);
                }
            }

            // Altera UI para estado finalizado
            btnText.innerText = "Converter Novamente";
            btnSpinner.classList.add('d-none');
            convertBtn.disabled = false;
            
            statusAlert.className = 'alert alert-success';
            statusAlert.innerHTML = `<i class="bi bi-check2-all"></i> Todas as conversões foram concluídas!`;
            
            // Limpa o input para permitir selecionar os mesmos arquivos novamente se necessário
            imageInput.value = '';
            resetUploadArea();
        });

        function resetUploadArea() {
            uploadTitle.innerHTML = "Clique para buscar imagens";
            uploadTitle.classList.replace('text-success', 'text-primary');
            uploadSubtitle.innerText = "ou arraste e solte aqui";
        }

        // Função de conversão da imagem para PDF usando jsPDF
        function processAndDownloadPDF(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                
                reader.onload = function(event) {
                    const img = new Image();
                    img.src = event.target.result;
                    
                    img.onload = function() {
                        const orientation = img.width > img.height ? 'landscape' : 'portrait';
                        const doc = new jsPDF({
                            orientation: orientation,
                            unit: 'px',
                            format: [img.width, img.height]
                        });

                        const fileType = file.type === 'image/png' ? 'PNG' : 'JPEG';
                        doc.addImage(img.src, fileType, 0, 0, img.width, img.height);

                        const baseName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
                        doc.save(`${baseName}.pdf`);
                        resolve();
                    };
                    img.onerror = reject;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }
    </script>
</body>
</html>
