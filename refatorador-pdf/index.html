<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperador Definitivo de PDF</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --container-bg: #ffffff;
            --text-color: #334155;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--container-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: #0f172a;
        }

        p {
            color: #64748b;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .file-upload-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        input[type="file"] {
            display: none;
        }

        .file-upload-label {
            display: block;
            padding: 16px;
            background-color: var(--bg-color);
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .file-upload-label:hover {
            border-color: var(--primary-color);
            background-color: #eff6ff;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;
            font-weight: 500;
            min-height: 24px;
        }

        .success { color: #16a34a; }
        .error { color: #dc2626; }
        .loading { color: #ca8a04; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Recuperador Definitivo</h1>
        <p>Este sistema usa renderização avançada para "fotografar" o PDF corrompido e gerar um arquivo 100% novo, preservando a orientação e tamanho originais.</p>

        <div class="file-upload-wrapper">
            <input type="file" id="pdfInput" accept="application/pdf">
            <label for="pdfInput" class="file-upload-label" id="fileLabel">
                📂 Clique para selecionar o arquivo PDF
            </label>
        </div>

        <button id="processBtn" disabled>Recuperar PDF Original</button>

        <div id="status"></div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        const { jsPDF } = window.jspdf;

        const pdfInput = document.getElementById('pdfInput');
        const fileLabel = document.getElementById('fileLabel');
        const processBtn = document.getElementById('processBtn');
        const statusDiv = document.getElementById('status');

        pdfInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                fileLabel.textContent = `📄 ${e.target.files[0].name}`;
                processBtn.disabled = false;
                statusDiv.textContent = ""; 
            } else {
                fileLabel.textContent = "📂 Clique para selecionar o arquivo PDF";
                processBtn.disabled = true;
            }
        });

        processBtn.addEventListener('click', async () => {
            const file = pdfInput.files[0];
            if (!file) return;

            statusDiv.textContent = "⏳ Renderizando e reconstruindo PDF... Aguarde.";
            statusDiv.className = "loading";
            processBtn.disabled = true;

            try {
                const arrayBuffer = await file.arrayBuffer();
                const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
                const pdf = await loadingTask.promise;
                
                let doc; // Tiramos a inicialização daqui para criar dinamicamente

                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    
                    // 1. Pega as dimensões exatas do arquivo original
                    const originalViewport = page.getViewport({ scale: 1.0 });
                    const isLandscape = originalViewport.width > originalViewport.height;
                    
                    // 2. Aumenta a escala apenas na hora de desenhar a imagem para alta qualidade
                    const renderViewport = page.getViewport({ scale: 2.5 });
                    
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = renderViewport.width;
                    canvas.height = renderViewport.height;
                    
                    await page.render({ canvasContext: ctx, viewport: renderViewport }).promise;
                    const imgData = canvas.toDataURL('image/jpeg', 1.0);
                    
                    // 3. Se for a primeira página, cria o arquivo com as dimensões dela
                    if (pageNum === 1) {
                        doc = new jsPDF({
                            orientation: isLandscape ? 'landscape' : 'portrait',
                            unit: 'pt', // Pontos, que é o padrão nativo do formato PDF
                            format: [originalViewport.width, originalViewport.height]
                        });
                    } else {
                        // Se houverem outras páginas, adiciona com o tamanho correspondente
                        doc.addPage([originalViewport.width, originalViewport.height], isLandscape ? 'landscape' : 'portrait');
                    }
                    
                    // 4. Cola a imagem preenchendo toda a página corretamente
                    doc.addImage(imgData, 'JPEG', 0, 0, originalViewport.width, originalViewport.height);
                }

                doc.save(`recuperado_${file.name}`);

                statusDiv.textContent = "✅ Pronto! PDF reconstruído com o formato e aparência originais.";
                statusDiv.className = "success";

            } catch (error) {
                console.error(error);
                statusDiv.textContent = "❌ Erro: Falha ao renderizar. O arquivo pode estar protegido.";
                statusDiv.className = "error";
            } finally {
                processBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
