<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refatorador e Corretor de PDF</title>
    
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --container-bg: #ffffff;
            --text-color: #334155;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--container-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: #0f172a;
        }

        p {
            color: #64748b;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .file-upload-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        input[type="file"] {
            display: none;
        }

        .file-upload-label {
            display: block;
            padding: 16px;
            background-color: var(--bg-color);
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .file-upload-label:hover {
            border-color: var(--primary-color);
            background-color: #eff6ff;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;
            font-weight: 500;
            min-height: 24px;
        }

        .success { color: #16a34a; }
        .error { color: #dc2626; }
        .loading { color: #ca8a04; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Refatorador de PDF</h1>
        <p>Selecione um PDF corrompido ou com bloqueio de impressão. O sistema tentará reconstruir o arquivo para você.</p>

        <div class="file-upload-wrapper">
            <input type="file" id="pdfInput" accept="application/pdf">
            <label for="pdfInput" class="file-upload-label" id="fileLabel">
                📂 Clique para selecionar o arquivo PDF
            </label>
        </div>

        <button id="processBtn" disabled>Refatorar PDF</button>

        <div id="status"></div>
    </div>

    <script>
        const pdfInput = document.getElementById('pdfInput');
        const fileLabel = document.getElementById('fileLabel');
        const processBtn = document.getElementById('processBtn');
        const statusDiv = document.getElementById('status');

        // Atualiza o visual quando o usuário escolhe um arquivo
        pdfInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                fileLabel.textContent = `📄 ${e.target.files[0].name}`;
                processBtn.disabled = false;
                statusDiv.textContent = ""; // Limpa mensagens anteriores
            } else {
                fileLabel.textContent = "📂 Clique para selecionar o arquivo PDF";
                processBtn.disabled = true;
            }
        });

        // Lógica de refatoração ao clicar no botão
        processBtn.addEventListener('click', async () => {
            const file = pdfInput.files[0];
            if (!file) return;

            statusDiv.textContent = "⏳ Processando arquivo... Aguarde.";
            statusDiv.className = "loading";
            processBtn.disabled = true;

            try {
                // 1. Lê o arquivo como um ArrayBuffer
                const arrayBuffer = await file.arrayBuffer();

                // 2. Carrega o PDF na biblioteca pdf-lib
                // A opção ignoreEncryption permite abrir arquivos com bloqueios de permissão (não ignora senhas reais de abertura)
                const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer, { 
                    ignoreEncryption: true,
                    updateMetadata: false 
                });

                // 3. Salva o PDF. Isso força a reconstrução de toda a estrutura do arquivo.
                const pdfBytes = await pdfDoc.save();

                // 4. Cria um link de download para o novo arquivo gerado
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = `refatorado_${file.name}`;
                document.body.appendChild(a);
                a.click();
                
                // Limpa o link da memória
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                statusDiv.textContent = "✅ Sucesso! O download do PDF arrumado deve começar em instantes.";
                statusDiv.className = "success";

            } catch (error) {
                console.error(error);
                statusDiv.textContent = "❌ Erro: O arquivo está muito corrompido ou protegido por senha forte.";
                statusDiv.className = "error";
            } finally {
                processBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
